<div class="essay-epigraph">

  {% if include.zh %}
    <div class="epigraph-zh">
      {{ include.zh | markdownify }}
    </div>
  {% endif %}

  {% if include.en %}
    <div class="epigraph-en">
      <em>{{ include.en | markdownify }}</em>
    </div>
  {% endif %}

  {% if include.ref %}
    <div class="epigraph-ref">
      {{ include.ref }}
    </div>
  {% endif %}

</div>
